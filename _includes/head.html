<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }}{% else %}{{ site.name }}{% endif %}</title>

  <!-- CSS -->
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/main.css" type="text/css">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/social-share-kit.css" type="text/css">

  <!-- Font -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.5.0/css/font-awesome.min.css">


  <link rel="alternate" type="application/rss+xml" title="RSS Feed for {{ site.name }}" href="{{ site.baseurl }}/feed.xml" />

  <style>
    p img { margin: 0 auto; }
    .side-scroll {
        overflow-x: auto;
    }
    .side-scroll .MathJax_Display {
        margin: 0em 0em 1em 0em;
    }
    .side-scroll::-webkit-scrollbar {
         -webkit-appearance: none;
         width: 3px;
         height: 4px;
         border: 1px solid rgb(235, 232, 232);
         border-radius: 4px;
     }
     .side-scroll::-webkit-scrollbar-thumb {
         border-radius: 4px;
         background-color: rgba(0,0,0,.5);
         box-shadow: 0 0 1px rgba(255,255,255,.5);

     } 
    h3, h4, h5, h6 {
        margin-top: 1.5rem !important;
    }
    ol li {
        margin-left: 20px;
    }
    /* Style the button that is used to open and close the collapsible content */
    .collapsible {
      background-color: #777;
      color: white;
      cursor: pointer;
      padding: 18px;
      width: 100%;
      border: none;
      text-align: left;
      outline: none;
      font-size: 15px;
    }

    .active, .collapsible:hover {
      background-color: #555;
    }

    .collapsible:after {
      content: "\002B";
      color: white;
      font-weight: bold;
      float: right;
      margin-left: 5px;
    }

    .active:after {
      content: "\2212";
    }

    .content {
      padding: 0 18px;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.2s ease-out;
      background-color: #f1f1f1;
    }
</style>

  {% include google-analytics.html %}

</head>
