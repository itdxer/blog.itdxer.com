<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prime Trainer</title>

<style>
    body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        margin: 0;
        padding: 16px;
        background: #f5f7fa;
        color: #222;
    }

    .container {
        max-width: 420px;
        margin: auto;
        background: white;
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    h1 {
        text-align: center;
        margin-bottom: 8px;
    }

    .number {
        font-size: 3rem;
        text-align: center;
        margin: 20px 0;
        font-weight: bold;
    }

    label {
        display: block;
        margin-bottom: 6px;
        font-weight: 500;
    }

    input {
        width: 959595959595959595%;
        font-size: 1.1rem;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #ccc;
    }

    .buttons {
        display: flex;
        gap: 12px;
        margin-top: 16px;
    }

    button {
        flex: 1;
        padding: 14px;
        font-size: 1.1rem;
        border-radius: 12px;
        border: none;
        cursor: pointer;
        font-weight: 600;
    }

    .yes { background: #4caf50; color: white; }
    .no { background: #f44336; color: white; }

    .next {
        background: #2196f3;
        color: white;
        margin-top: 12px;
        width: 100%;
    }

    .feedback {
        text-align: center;
        margin-top: 12px;
        font-weight: 600;
    }

    .factors {
        margin-top: 8px;
        font-size: 0.95rem;
        text-align: center;
        word-wrap: break-word;
    }

    .stats {
        margin-top: 16px;
        background: #f0f2f5;
        padding: 12px;
        border-radius: 12px;
        font-size: 0.95rem;
    }
</style>
</head>
<body>

<div class="container">
    <h1>Is it a prime?</h1>

    <div class="number" id="number">–</div>

    <div class="buttons">
        <button class="yes" onclick="answer(true)">Prime</button>
        <button class="no" onclick="answer(false)">Not Prime</button>
    </div>

    <button class="next" onclick="nextNumber()">Next Number</button>

    <div class="feedback" id="feedback"></div>
    <div class="factors" id="factors"></div>

    <div class="stats">
        <div><strong>Today</strong></div>
        <div>Correct: <span id="correct">0</span></div>
        <div>Incorrect: <span id="incorrect">0</span></div>
    </div>
    <br>
    <label for="maxN">Maximum N</label>
    <input type="number" id="maxN" min="21">
</div>

<script>
/* ---------- Cookies ---------- */
function setCookie(name, value, days = 365) {
    const d = new Date();
    d.setTime(d.getTime() + days * 86400000);
    document.cookie = `${name}=${value};expires=${d.toUTCString()};path=/`;
}

function getCookie(name) {
    return document.cookie
        .split("; ")
        .find(row => row.startsWith(name + "="))
        ?.split("=")[1];
}

/* ---------- Math ---------- */
function isPrime(n) {
    if (n < 2) return false;
    if (n === 2) return true;
    if (n % 2 === 0) return false;
    for (let i = 3; i * i <= n; i += 2) {
        if (n % i === 0) return false;
    }
    return true;
}

function getFactors(n) {
    const factors = [];
    let d = 2;

    while (d * d <= n) {
        while (n % d === 0) {
            factors.push(d);
            n /= d;
        }
        d++;
    }

    if (n > 1) {
        factors.push(n);
    }

    return factors;
}
function randomValidNumber(min, max) {
    let n;
    do {
        n = Math.floor(Math.random() * (max - min + 1)) + min;
    } while (n % 2 === 0 || n % 5 === 0);
    return n;
}

/* ---------- Daily Stats ---------- */
const todayKey = "primeStats_" + new Date().toISOString().slice(0, 10);

function loadStats() {
    const stats = JSON.parse(localStorage.getItem(todayKey)) || { correct: 0, incorrect: 0 };
    document.getElementById("correct").textContent = stats.correct;
    document.getElementById("incorrect").textContent = stats.incorrect;
    return stats;
}

function saveStats(stats) {
    localStorage.setItem(todayKey, JSON.stringify(stats));
}

/* ---------- App ---------- */
let currentNumber = null;
let stats = loadStats();

const maxNInput = document.getElementById("maxN");
maxNInput.value = getCookie("maxN") || 1000;

maxNInput.addEventListener("change", () => {
    setCookie("maxN", maxNInput.value);
    nextNumber();
});

function nextNumber() {
    const maxN = Math.max(21, parseInt(maxNInput.value, 10));
    currentNumber = randomValidNumber(20, maxN);
    document.getElementById("number").textContent = currentNumber;
    document.getElementById("feedback").textContent = "";
    document.getElementById("factors").textContent = "";
}

function answer(userSaysPrime) {
    if (currentNumber === null) return;

    const prime = isPrime(currentNumber);
    const feedback = document.getElementById("feedback");
    const factorsEl = document.getElementById("factors");

    if (userSaysPrime === prime) {
        stats.correct++;
        feedback.textContent = "✅ Correct!";
        feedback.style.color = "#4caf50";
    } else {
        stats.incorrect++;
        feedback.textContent = "❌ Incorrect";
        feedback.style.color = "#f44336";
    }

    if (!prime) {
        const factors = getFactors(currentNumber);
        factorsEl.textContent = `Factors: ${factors.join(", ")}`;
    } else {
        factorsEl.textContent = "This number is prime.";
    }

    saveStats(stats);
    loadStats();
}

/* ---------- Init ---------- */
nextNumber();
</script>

</body>
</html>
